# Kimi Code CLI Platform Overlay for life-planning-coach
# Merged with SKILL.master.md by build-platform-skill.py
#
# Kimi Code CLI is a terminal coding agent with:
# - Full filesystem access (read_file, write_file)
# - references/ directory support via read_file
# - MCP support (Google Calendar, Google Drive)
# - No 10-step limit
# - No KIMI_REF tags (those are for OK Computer web UI)
# - No memory_space tool (use filesystem instead)

