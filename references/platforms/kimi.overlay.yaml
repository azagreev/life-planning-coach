    new: "| Context limit approaching (Base Chat 10 steps) | Сделай краткий summary в `memory_space` и предложи перейти в OK Computer mode (kimi.com/agent) или продолжить новой сессией. |"

  - old: "- **AI Memory**: Ключевые факты записываются автоматически в формате \"Запомни: пользователь [имя] работает над [цель]...\"\n- **Cloud Storage**: Данные хранятся в папке пользователя (`Life Planning Coach Wiki/`). Скилл только обновляет файлы, не имеет прямого доступа к токенам."
    new: "- **`memory_space`**: Ключевые факты сохраняются через `memory_space_edits` tool. Content должен начинаться с \"User / 用户\". НИКОГДА не говори \"запомню\" без вызова tool.\n- **File export**: Для wiki persistence используй `write_file` → скачивание пользователем. Kimi не имеет встроенного Google Drive connector."

  - old: "- Calendar: connector integration + 4 presets + free slots + text daily top-3"
