name: Release Checks

on:
  pull_request:
  push:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run all tests
        run: python3 -m pytest tests/ -q --tb=short

      - name: Build artifacts
        run: bash scripts/build-skill.sh

      - name: Verify artifacts
        run: |
          ls -la dist/
          test -f dist/life-planning-coach-*.zip
          test -f dist/life-planning-coach-*.skill
          test -f dist/life-planning-coach-*-grok.md
          test -f dist/life-planning-coach-*-kimi.md
          test -f dist/life-planning-coach-*-kimi-cli.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: life-planning-coach-artifacts
          path: dist/*
          retention-days: 14
