name: Build and publish artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest

      - name: Run all tests
        run: python3 -m pytest tests/ -q --tb=short

      - name: Build all artifacts
        run: bash scripts/build-skill.sh

      - name: Verify artifacts
        run: |
          ls -la dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/life-planning-coach-*.zip
            dist/life-planning-coach-*.skill
            dist/life-planning-coach-*-grok.md
            dist/life-planning-coach-*-kimi.md
            dist/life-planning-coach-*-kimi-cli.zip
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
