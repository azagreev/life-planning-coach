[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-planning-coach"
version = "0.1.0"
description = "Google Calendar и Tasks интеграция для life planning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.1",
    "cryptography>=41.0.0",
    "typing-extensions>=4.7.0; python_version < '3.11'",
    "pytz>=2023.3",
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "freezegun>=1.2.0",
]

[project.scripts]
lpc-setup = "calendar_integration.example_usage:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"
