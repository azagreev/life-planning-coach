# pyproject.toml — minimal config for pytest + coverage + ruff.
# setup.py остаётся источником правды для пакета (legacy compat).

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
# e2e tests require external services — skip by default; opt-in via `-m e2e`.
markers = [
    "e2e: end-to-end tests requiring external services",
]

[tool.coverage.run]
branch = true
source = ["scripts", "tests"]
omit = [
    "tests/e2e/*",
    "*/__pycache__/*",
    ".build/*",
    "dist/*",
    # build-platform-skill.py is exercised end-to-end via build artifacts;
    # unit-testing its 30+ helper functions duplicates work and adds churn.
    # Coverage is measured via output equivalence in test_platform_parity.py.
    "scripts/build-platform-skill.py",
]

[tool.coverage.report]
# Skill is markdown-first; Python coverage is a code-health signal, not a quality gate.
# Threshold reflects unit-testable Python: build-skill.py CLI helpers,
# gating_logic.py protocol, extract-release-notes.py, rename_persona_modules.py.
#
# v1.0 baseline = 50% (gated). cmd_verify/cmd_release flows have integration
# coverage via subprocess + git, not unit coverage. Aspirational target 85%
# is tracked in ROADMAP — раise as build-skill.py gets more isolated helpers.
fail_under = 50
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = ".coverage_html"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".build", "dist", "docs/archive", "docs/research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line-length — handled by formatter, не блокируем CI
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
